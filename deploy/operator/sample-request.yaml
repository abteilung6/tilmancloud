# Example request to the ClickHouseService API.
# The controller applies ConfigMap, Secret, Services, and StatefulSet from this.
# Namespace is here so apply works before deploy/manifests/managed exists.
apiVersion: v1
kind: Namespace
metadata:
  name: clickhouse-managed
  labels:
    app.kubernetes.io/part-of: tilmancloud
---
apiVersion: clickhouse.tilmancloud.io/v1alpha1
kind: ClickHouseService
metadata:
  name: clickhouse
  namespace: clickhouse-managed
spec: {}
